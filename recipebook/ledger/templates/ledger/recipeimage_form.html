{% extends 'base.html' %}
{% block heading %}
{% block title %}Recipe Image Form{% endblock %}
{% endblock %}
{% block content %}
    <a href="{% url 'ledger:recipe-detail' view.kwargs.pk %}">Return to Recipe</a>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Submit">
    </form>
    
{% endblock %}
