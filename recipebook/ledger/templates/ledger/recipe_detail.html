{% extends 'base.html' %}
{% block heading %}
{% block title %}{{ recipe.name }}{% endblock %}
{% endblock %}
{% block content %}
    <p>{{ recipe.author.name }}</p>
    <ul>
        {% for ingredient in ingredients %}
            <li>{{ ingredient.ingredient.name }} - {{ ingredient.quantity }}</li>
        {% endfor %}
    </ul>
{% endblock %}
